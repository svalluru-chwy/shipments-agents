# Shipment Decoder Agent Manifest
name: shipment_decoder
version: "1.0.0"
description: >
  Root cause analysis and signal decoding.
  Orchestrates Phase 2 skills: delay prediction and signal decoding.
  Receives Phase 1 outputs (signals) as upstream data and performs
  deeper analysis to understand why shipment issues occurred.

agent_name: shipment_decoder

s3_sources:
  - folder: shipment_agency_revised/signals
    description: Phase 1 signal detection output
    required: true
  - folder: data/shipment_inspector_query
    description: Detailed shipment inspection data
    required: false

required_env:
  - OPENAI_API_KEY

output_types:
  - json
  - markdown

output_path_template: "{base_path}/{customer_id}/shipment_agency_revised/decoded_signals/"

depends_on:
  - shipment_signals

skills:
  - shipment_delay_predictor
  - shipment_signal_decoder
